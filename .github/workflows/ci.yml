name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # AI Studio periodically rewrites package-lock.json on its own, which can leave it out of sync with
      # package.json. Report that as a warning but do not fail the build on it.
      - name: Lockfile in sync? (warning only)
        run: npm ci --dry-run || echo "::warning::package-lock.json is out of sync with package.json (run 'npm install' and commit the lockfile)"

      - name: Install (tolerates lockfile drift)
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: End-to-end tests (MCP connector, kiosk operations, email; Firebase emulators)
        run: |
          npm install -g firebase-tools
          npm test
